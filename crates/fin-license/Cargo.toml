[package]
name = "fin-license"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fin-core = { path = "../fin-core" }
ed25519-dalek = "2"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

rand = { version = "0.8", optional = true }
hmac = "0.12"
sha2 = "0.10"

[features]
# Seller-side command line tool: `cargo run -p fin-license --features tool --bin golden-license`.
tool = ["dep:rand", "ed25519-dalek/rand_core"]

[[bin]]
name = "golden-license"
path = "src/bin/golden-license.rs"
required-features = ["tool"]

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
