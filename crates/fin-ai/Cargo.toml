[package]
name = "fin-ai"
description = "Golden: local model catalog, hardware check and resumable verified model downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net"] }

[dev-dependencies]
tempfile = "3"

[features]
# The real inference engine. Off by default: it compiles llama.cpp, which needs cmake and clang.
llama = ["dep:llama-cpp-2"]
# Vulkan GPU support for Windows. Metal is enabled automatically on Apple silicon.
llama-vulkan = ["llama", "llama-cpp-2/vulkan"]

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["common"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["common", "metal"] }
