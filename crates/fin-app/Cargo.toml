[package]
name = "fin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fin-core = { path = "../fin-core" }
fin-db = { path = "../fin-db", default-features = false }
fin-ingest = { path = "../fin-ingest" }
fin-ledger = { path = "../fin-ledger" }
fin-license = { path = "../fin-license" }
fin-plan = { path = "../fin-plan" }
fin-plaid = { path = "../fin-plaid" }
serde_json.workspace = true
ed25519-dalek = "2"
serde.workspace = true
chrono.workspace = true
getrandom = "0.2"
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tempfile = "3"

[features]
default = ["plain"]
plain = ["fin-db/plain"]
sqlcipher = ["fin-db/sqlcipher"]
