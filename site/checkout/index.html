<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Checkout</title>
  <style>
    :root { --bg: #fbf9f4; --fg: #1d1b16; --muted: #6d675a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16140f; --fg: #f1ede2; --muted: #a39b88; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { padding: 24px 16px; max-width: 28rem; text-align: center; }
    #message { margin: 0 0 16px; }
    button { font: inherit; padding: 8px 16px; cursor: pointer; }
    p.small { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p id="message" role="status">Loading…</p>
    <button id="retry" type="button">Open checkout</button>
    <p class="small">Payments are handled by Paddle, our merchant of record.</p>
  </main>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script type="module">
    import { main } from "./checkout.js";
    main();
  </script>
</body>
</html>
