name: App
on:
  pull_request:
    paths: ["apps/desktop/**", "crates/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  build:
    name: Build ${{ matrix.name }}
    needs: ui
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin, artifact: golden-macos-arm64 }
          - { name: Windows (x64), os: windows-latest, args: "", target: x86_64-pc-windows-msvc, artifact: golden-windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: npm ci
        working-directory: apps/desktop
      - name: Build (pull requests only build)
        if: github.event_name != 'push'
        working-directory: apps/desktop
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Build and publish nightly release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: nightly
          releaseName: "Golden nightly (latest main)"
          releaseBody: "Unsigned build of the latest main. macOS: right-click, Open the first time. Windows: choose More info, then Run anyway."
          releaseDraft: false
          prerelease: true
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
