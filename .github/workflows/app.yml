name: App
on:
  pull_request:
    paths: ["apps/desktop/**", "crates/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # llama.cpp uses std::filesystem, which needs macOS 10.15 or later.
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  # Golden's bank-sync service (AWS Lambda; public address, no secrets in it). Built into the app.
  GOLDEN_PLAID_SERVICE_URL: https://xp5i3v3hsjv5wpxyzxbnn4jkay0oyptk.lambda-url.us-east-2.on.aws
jobs:
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  build:
    name: Build ${{ matrix.name }}
    needs: ui
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin, artifact: golden-macos-arm64 }
          - { name: Windows (x64), os: windows-latest, args: "", target: x86_64-pc-windows-msvc, artifact: golden-windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: npm ci
        working-directory: apps/desktop
      - name: Stamp the build number
        # Every run gets the next number (the workflow run number, which only goes up). It becomes
        # the last part of the version (0.1.<build>), so it is in the installer and bundle file
        # names and the app's own metadata, and the app shows it on its About page.
        shell: bash
        run: |
          V="0.1.${{ github.run_number }}" node -e '
            const fs = require("fs");
            const f = "apps/desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.env.V;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '
          echo "GOLDEN_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "GOLDEN_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Configure Apple signing and notarization
        # Only for push or manual runs on main (never pull requests), on the macOS runner.
        # Exports the Tauri signing variables only when their secrets exist, so builds stay
        # unsigned (not broken) without them.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && runner.os == 'macOS'
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_ID_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          S_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          S_API_KEY: ${{ secrets.APPLE_API_KEY }}
          S_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export_var() { # name value
            local d="EOF_$RANDOM$RANDOM"
            { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_ENV"
          }
          if [ -z "$S_CERT" ] || [ -z "$S_CERT_PW" ]; then
            echo "::notice::Apple signing secrets not set; building unsigned."
            exit 0
          fi
          export_var APPLE_CERTIFICATE "$(printf '%s' "$S_CERT" | tr -d ' \r\n')"
          export_var APPLE_CERTIFICATE_PASSWORD "$S_CERT_PW"
          if [ -n "$S_IDENTITY" ]; then export_var APPLE_SIGNING_IDENTITY "$S_IDENTITY"; fi
          if [ -n "$S_ID" ] && [ -n "$S_ID_PW" ] && [ -n "$S_TEAM" ]; then
            export_var APPLE_ID "$S_ID"
            export_var APPLE_PASSWORD "$S_ID_PW"
            export_var APPLE_TEAM_ID "$S_TEAM"
            echo "::notice::Signing and notarizing with Apple ID."
          elif [ -n "$S_API_ISSUER" ] && [ -n "$S_API_KEY" ] && [ -n "$S_API_KEY_P8" ]; then
            printf '%s\n' "$S_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export_var APPLE_API_ISSUER "$S_API_ISSUER"
            export_var APPLE_API_KEY "$S_API_KEY"
            export_var APPLE_API_KEY_PATH "$RUNNER_TEMP/AuthKey.p8"
            echo "::notice::Signing and notarizing with App Store Connect API key."
          else
            echo "::notice::Signing only; notarization credentials not set."
          fi
      - name: Build (pull requests only build)
        if: github.event_name == 'pull_request'
        env:
          GOLDEN_PRICE_ID: ${{ secrets.GOLDEN_PRICE_ID }}
          GOLDEN_PLAID_PRICE_ID: ${{ secrets.GOLDEN_PLAID_PRICE_ID }}
          GOLDEN_CHECKOUT_URL: ${{ vars.GOLDEN_CHECKOUT_URL }}
        working-directory: apps/desktop
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Build and publish nightly release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLDEN_PRICE_ID: ${{ secrets.GOLDEN_PRICE_ID }}
          GOLDEN_PLAID_PRICE_ID: ${{ secrets.GOLDEN_PLAID_PRICE_ID }}
          GOLDEN_CHECKOUT_URL: ${{ vars.GOLDEN_CHECKOUT_URL }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: nightly
          releaseName: "Golden nightly (build ${{ github.run_number }})"
          releaseBody: "Latest main, build ${{ github.run_number }} (version 0.1.${{ github.run_number }}). macOS is signed and notarized when Apple credentials are configured; if it is not, right-click, Open the first time. Windows: choose More info, then Run anyway."
          releaseDraft: false
          prerelease: true
      - name: Notarize and staple the disk image
        # Tauri notarizes the app inside; this does the .dmg itself too so Gatekeeper accepts the
        # download without a network check, then replaces the release's copy with the stapled one.
        if: github.event_name != 'pull_request' && runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_PASSWORD != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dmg in apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            echo "Checking what Gatekeeper will say about the download"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            app="$mnt/Golden.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vv -t exec "$app"
            xcrun stapler validate "$app"
            hdiutil detach "$mnt" >/dev/null
            gh release upload nightly "$dmg" --repo "$GITHUB_REPOSITORY" --clobber
          done
      - name: Remove installers from older builds
        # Installer names carry the build number, so old ones would pile up on the release.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -E '^Golden_0\.1\.[0-9]+_' | grep -v "^Golden_0\.1\.${{ github.run_number }}_" |
            while read -r name; do
              echo "Removing $name"
              gh release delete-asset nightly "$name" --repo "$GITHUB_REPOSITORY" --yes
            done || true
          # The action only sets the title and notes when it creates a release, so keep them
          # current: whoever opens the page sees which build is newest.
          gh release edit nightly --repo "$GITHUB_REPOSITORY" \
            --title "Golden nightly (build ${{ github.run_number }})" \
            --notes "Latest main, build ${{ github.run_number }} (version 0.1.${{ github.run_number }}). macOS is signed and notarized when Apple credentials are configured; if it is not, right-click, Open the first time. Windows: choose More info, then Run anyway." || true
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
