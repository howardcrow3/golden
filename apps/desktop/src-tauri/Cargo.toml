[package]
name = "golden-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "golden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fin-plan = { path = "../../../crates/fin-plan" }
fin-plaid = { path = "../../../crates/fin-plaid" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
fin-app = { path = "../../../crates/fin-app", default-features = false, features = ["sqlcipher"] }
fin-db = { path = "../../../crates/fin-db", default-features = false, features = ["sqlcipher"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
fin-ai = { path = "../../../crates/fin-ai", features = ["llama"] }
fin-license = { path = "../../../crates/fin-license" }
chrono = "0.4"
