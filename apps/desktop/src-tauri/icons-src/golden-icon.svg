<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Golden app icon: periodic table tile for gold (Au, 79)</title>
  <!-- Colors: --gold #b08d3a (apps/desktop/src/app.css), --charcoal #2a2724. Gold fills the tile and is never used as text. -->
  <rect x="100" y="100" width="824" height="824" fill="#b08d3a"/>
  <rect x="136" y="136" width="752" height="752" fill="none" stroke="#2a2724" stroke-width="12"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#2a2724">
    <text x="192" y="290" font-size="118" font-weight="600">79</text>
    <text x="832" y="290" font-size="64" font-weight="500" text-anchor="end">196.97</text>
    <text x="512" y="682" font-size="450" font-weight="700" text-anchor="middle" letter-spacing="-12">Au</text>
    <text x="192" y="822" font-size="84" font-weight="500" letter-spacing="2">Gold</text>
  </g>
</svg>
